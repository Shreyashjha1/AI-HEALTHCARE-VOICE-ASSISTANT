<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthcare Voice Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🩺 Healthcare Voice Assistant</h1>
      <p>Your accessible guide to basic health information</p>
    </header>

    <main>
      <div class="voice-box">
        <button id="start-btn" class="btn-primary">🎤 Start Conversation</button>
        <p id="user-text" class="user-text">Speak your question...</p>
      </div>

      <div class="response-box">
        <h2>AI Response:</h2>
        <div id="ai-response" class="ai-response">
          <em>Waiting for input...</em>
        </div>
      </div>
    </main>

    <footer>
      <p>⚠️ Disclaimer: This assistant provides general health guidance only. 
      It does not diagnose, prescribe, or replace medical professionals.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
